plugins {
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.137'
}

configurations {
    clientOnlyMods {
        // Request Mojang-mapped ("named") artifacts so NeoForged's SRG→Mojang
        // RemappingTransform is applied, matching what modRuntimeOnly gets.
        attributes {
            attribute(
                Attribute.of("net.neoforged.moddevgradle.legacy.minecraft_mappings.v2", Named),
                objects.named(Named, "named")
            )
        }
    }
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_name
}

legacyForge {
    version = forge_version

    validateAccessTransformers = true

    runs {
        client {
            client()
        }
        data {
            data()
        }
        server {
            server()
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', 'genesis'
        }
    }

    mods {
        testproject {
            sourceSet sourceSets.main
        }
    }
}

mixin {
    add sourceSets.main, "mixins.shipwrights.genesis.refmap.json"
    config 'genesis.mixins.json' // This can be done for multiple configs
}

jar {
    manifest.attributes([
            "MixinConfigs": "genesis.mixins.json"
    ])
}

repositories {
    flatDir { dir 'libs'}
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }

    maven {
        name = "Valkyrien Skies Internal"
        url = 'https://maven.valkyrienskies.org'
        // Mirrors the KFF pom but not the -all jar, so resolve KFF from its own maven
        content { excludeGroup 'thedarkcolour' }
    }

    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }

    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }

    maven { url = "https://maven.ithundxr.dev/mirror" }

    maven { url = "https://maven.enjarai.dev/mirrors" }

    mavenCentral()
}

dependencies {
    annotationProcessor("org.spongepowered:mixin:0.8.5:processor")

    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    implementation("io.github.llamalad7:mixinextras-forge:0.5.0")


    // region Valkyrien Skies: optional. Compiled against, and in dev runs and gametests unless -PwithoutVs is passed,
    // to check Genesis without it. Only shipwrights.genesis.compat.vs may use its classes
    def withVs = !project.hasProperty("withoutVs")
    for (String module : ["api", "internal", "util", "impl"]) {
        compileOnly("org.valkyrienskies.core:${module}:${vs_core_version}") { transitive = false
            exclude group: 'org.joml', module: ''
        }
        if (withVs) {
            runtimeOnly("org.valkyrienskies.core:${module}:${vs_core_version}") { transitive = false
                exclude group: 'org.joml', module: ''
            }
        }
    }
    modCompileOnly("org.valkyrienskies:valkyrienskies-120-forge:${vs2_version}") { transitive = false
        exclude group: 'org.valkyrienskies.core', module: ''
    }
    if (withVs) {
        modRuntimeOnly("org.valkyrienskies:valkyrienskies-120-forge:${vs2_version}") { transitive = false
            exclude group: 'org.valkyrienskies.core', module: ''
        }
    }
    // endregion

    // region VS deps
    // VS core's API is Kotlin and Jackson-annotated, so compiling against it needs these. At runtime they come from
    // KFF and ZPS
    //noinspection DifferentStdlibGradleVersion
    compileOnly("org.jetbrains.kotlin:kotlin-stdlib:2.0.0")
    compileOnly("com.fasterxml.jackson.core:jackson-annotations:2.13.3")
    compileOnly("org.joml:joml:1.10.4")
    // Genesis's own geometry uses it. Bundled, as VS also bundles it, which JarJar settles to one copy. In dev, VS's
    // copy is the only one when it's there, as two would clash
    if (!withVs) {
        additionalRuntimeClasspath("org.joml:joml-primitives:1.10.0")
    }
    compileOnly("org.joml:joml-primitives:1.10.0")
    jarJar("org.joml:joml-primitives:1.10.0") {
        version {
            strictly "[1.10.0,)"
            prefer "1.10.0"
        }
    }
    // endregion

    jarJar(modImplementation("maven.modrinth:pehkui:3.8.2+1.20.1-forge"))

    // ZPS requires it at runtime; Genesis has no Kotlin of its own
    modRuntimeOnly("thedarkcolour:kotlinforforge:4.11.0")

    additionalRuntimeClasspath("org.maplibre:earcut4j:3.0.0")
    jarJar(implementation("org.maplibre:earcut4j:3.0.0")) {
        version {
            strictly "[3.0.0,)"
            prefer "3.0.0"
        }
    }

    // Test dependencies
    testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.0")
    testImplementation("org.joml:joml:1.10.4")
    testImplementation("org.joml:joml-primitives:1.10.0")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.10.0")

    modImplementation("g_mungus:zps:1.20.1-2.7.0-pre4") // libs/zps-1.20.1-2.7.0-pre4.jar
    // Optional, but needed in dev: ZPS gametests reference Create classes, and Forge loads every gametest class in dev
    modRuntimeOnly("maven.modrinth:create:mc1.20.1-6.0.8")

    modRuntimeOnly("maven.modrinth:spark:1.10.53-forge")
    modRuntimeOnly("mezz.jei:jei-1.20.1-forge:15.20.0.129")

    clientOnlyMods("maven.modrinth:forge-config-screens:v8.0.2-1.20.1-Forge")
}

afterEvaluate {
    tasks.named('runClient') {
        classpath += configurations.clientOnlyMods.incoming.files
    }
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}