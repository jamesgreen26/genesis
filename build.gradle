plugins {
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.137'
}

configurations {
    // Mods that are on the classpath for local runs and gametests only: never compiled against, never shipped
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_name
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    validateAccessTransformers = true

    runs {
        client {
            client()
        }
        data {
            data()
        }
        server {
            server()
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', 'genesis'
        }
    }

    mods {
        genesis {
            sourceSet sourceSets.main
        }
    }

    // Unit tests run in a loaded game, as some need Minecraft bootstrapped, which NeoForge only allows with the mod
    // loader present
    unitTest {
        enable()
        testedMod = mods.genesis
    }
}

repositories {
    flatDir { dir 'libs' }
    mavenCentral()

    maven { url = "https://maven.createmod.net" }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = "Valkyrien Skies Internal"
        url = 'https://maven.valkyrienskies.org'
        content { includeGroupByRegex "org\\.valkyrien.*" }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup "thedarkcolour" }
    }
    maven { url = "https://maven.ithundxr.dev/mirror" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven { url = "https://maven.ftb.dev/releases" }
    maven {
        name = "RyanHCode Maven"
        url = "https://maven.ryanhcode.dev/releases"
    }
}

dependencies {
    compileOnly("io.github.llamalad7:mixinextras-common:0.5.0")
    jarJar(implementation("io.github.llamalad7:mixinextras-neoforge:0.5.0")) {
        version {
            strictly "[0.5.0,)"
            prefer "0.5.0"
        }
    }

    // region Valkyrien Skies: optional, and as no 1.21.1 build exists, compiled against the 1.20.1 one and never on
    // the path at runtime. Only shipwrights.genesis.compat.vs may use its classes, which is only reached once VS is
    // known to be loaded
    for (String module : ["api", "internal", "util", "impl"]) {
        compileOnly("org.valkyrienskies.core:${module}:${vs_core_version}") { transitive = false }
    }
    compileOnly("org.valkyrienskies:valkyrienskies-120-forge:${vs2_version}") { transitive = false }
    // endregion

    // region Sable: optional. Only shipwrights.genesis.compat.sable may use its classes, which is only reached once
    // Sable is known to be loaded. Its common code is the API it builds on; the companion carries the rest of its API
    compileOnly("dev.ryanhcode.sable:sable-common-${minecraft_version}:${sable_version}") { transitive = false }
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}") {
        transitive = false
    }
    // endregion

    // region VS deps
    // VS core's API is Kotlin and Jackson-annotated, so compiling against it needs these
    //noinspection DifferentStdlibGradleVersion
    compileOnly("org.jetbrains.kotlin:kotlin-stdlib:2.0.0")
    compileOnly("com.fasterxml.jackson.core:jackson-annotations:2.13.3")
    // endregion

    // Genesis's own geometry uses it
    jarJar(implementation("org.joml:joml-primitives:1.10.0")) {
        version {
            strictly "[1.10.0,)"
            prefer "1.10.0"
        }
    }
    additionalRuntimeClasspath("org.joml:joml-primitives:1.10.0")

    jarJar(implementation("org.maplibre:earcut4j:3.0.0")) {
        version {
            strictly "[3.0.0,)"
            prefer "3.0.0"
        }
    }
    additionalRuntimeClasspath("org.maplibre:earcut4j:3.0.0")

    implementation("g_mungus:zps:${zps_version}") // libs/zps-${zps_version}.jar
    // ZPS's Kotlin dependencies (Kelvin) need KFF at runtime
    localRuntime("thedarkcolour:kotlinforforge-neoforge:5.8.0")
    // Optional, but needed in dev: ZPS gametests reference Create classes, and NeoForge loads every gametest class
    // in dev. The full jar, which carries the Registrate, Ponder and Flywheel it needs
    localRuntime("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    // Likewise Sable, which ZPS's gametests reference too. Its POM asks for builds of Create and its libraries that
    // this build already has
    localRuntime("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
        exclude group: 'com.simibubi.create'
        exclude group: 'net.createmod.ponder'
        exclude group: 'net.createmod'
        exclude group: 'dev.engine-room.flywheel'
        exclude group: 'com.tterrag.registrate'
    }
    // Sable's POM pins an older Veil than the one it runs best with
    localRuntime("foundry.veil:veil-neoforge-${minecraft_version}:${veil_version}")

    // Optional, and off unless asked for with -Pc2me: C2ME loads chunks in place of vanilla, so what Genesis does to
    // chunk loading has to be tried with it too
    if (project.hasProperty('c2me')) {
        localRuntime("maven.modrinth:c2me-neoforge:${c2me_version}")
    }

    localRuntime("maven.modrinth:spark:${spark_version}")
    localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    // Test dependencies
    testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.0")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.10.0")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

test {
    useJUnitPlatform()
}

// Unit tests run in the game too, so need the same non-mod libraries every run has
configurations.neoForgeTestLibraries.extendsFrom configurations.additionalRuntimeClasspath

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
