modLoader = "javafml"
loaderVersion = "[4,)"
#issueTrackerURL = ""
license = "Apache 2.0"

[[mods]]
modId = "genesis"
version = "${version}"
displayName = "Genesis"
authors = "G_Mungus, Quoissant, Cosmos, Frisk256, Acrogenous, BrickyBoy, Jcm, metafive, GuyApooye, ThePlasticPotato"
description = '''
A space mod.
'''
logoFile = "assets/genesis/icon.png"

[[mixins]]
config = "genesis.mixins.json"

# Into Sable, applied only when it's installed
[[mixins]]
config = "genesis.sable.mixins.json"

# Into Catnip, which comes with Ponder and so with Create, applied only when it and Sable are installed
[[mixins]]
config = "genesis.catnip.mixins.json"

# Into Simulated, which Create Aeronautics is built on, applied only when it's installed
[[mixins]]
config = "genesis.simulated.mixins.json"

# Into C2ME, applied only when its chunk system is installed
[[mixins]]
config = "genesis.c2me.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.genesis]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.genesis]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.genesis]]
modId = "zps"
type = "required"
versionRange = "[1.21.1-2.7.0-pre4,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.genesis]]
modId = "valkyrienskies"
type = "optional"
versionRange = "[2.4.11,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.genesis]]
modId = "sable"
type = "optional"
versionRange = "[2.0.5,)"
ordering = "NONE"
side = "BOTH"
